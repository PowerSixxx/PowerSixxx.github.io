<!DOCTYPE html>
<html lang="en">

<head>
    <script>(function(){var s=localStorage.getItem('theme');if(s?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – Baowen Liu</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f7f5f0;
            --text-main: #1c1917;
            --text-sub: #57534e;
            --primary: #2563eb;
            --border: #e5e1d8;
        }

        [data-theme="dark"] {
            --bg-body: #000000;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --border: #1f1f24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: var(--bg-body);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-main);
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Same BAOWEN watermark as the site footer */
        body::before {
            content: "BAOWEN";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(5rem, 22vw, 18rem);
            font-weight: 800;
            line-height: 0.8;
            color: rgba(0, 0, 0, 0.04);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        [data-theme="dark"] body::before {
            color: rgba(255, 255, 255, 0.10);
        }

        .box {
            position: relative;
            text-align: center;
            max-width: 480px;
        }

        .code {
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--primary);
        }

        h1 {
            font-size: 1.5rem;
            margin: 1rem 0 0.6rem;
        }

        p {
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 1.8rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 999px;
            background: var(--text-main);
            color: var(--bg-body);
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .links {
            margin-top: 1.4rem;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 0.4rem;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="code">404</div>
        <h1 data-en="Page not found" data-zh="页面不存在">Page not found</h1>
        <p data-en="The page you are looking for doesn't exist or has been moved."
            data-zh="你访问的页面不存在，或者已经被移动。">The page you are looking for doesn't exist or has been moved.</p>
        <a class="btn" href="/" data-en="← Back to Home" data-zh="← 返回主页">← Back to Home</a>
        <div class="links">
            <a href="/about.html" data-en="About Me" data-zh="关于我">About Me</a> ·
            <a href="/#experience" data-en="Experience" data-zh="经历">Experience</a> ·
            <a href="/#projects" data-en="Projects" data-zh="项目">Projects</a>
        </div>
    </div>

    <script>
        // Follow the site's saved language preference
        const lang = localStorage.getItem('lang') || 'en';
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-en]').forEach(el => {
            el.textContent = el.getAttribute(lang === 'zh' ? 'data-zh' : 'data-en');
        });
    </script>
</body>

</html>
