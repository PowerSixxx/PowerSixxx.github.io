<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects – Baowen Liu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The font style is consistent with that of the homepage -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050510;
            --bg-card: rgba(255, 255, 255, 0.075);
            --bg-header: rgba(255, 255, 255, 0.08);
            --text-main: #f9fafb;
            --text-sub: #a8b3cf;
            --accent: #c084fc;
            --accent-2: #22d3ee;
            --border: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }

        body {
            background:
                radial-gradient(circle at 12% 8%, rgba(168, 85, 247, 0.32), transparent 28rem),
                radial-gradient(circle at 85% 18%, rgba(34, 211, 238, 0.18), transparent 26rem),
                radial-gradient(circle at 50% 95%, rgba(244, 114, 182, 0.16), transparent 30rem),
                var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 70px 70px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent 82%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
        }

        .breadcrumb a {
            color: var(--text-sub);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: var(--accent);
        }

        h1 {
            text-align: center;
            font-size: clamp(2.6rem, 8vw, 6rem);
            line-height: 0.95;
            margin-bottom: 2rem;
            font-weight: 900;
            text-shadow: 0 0 34px rgba(168, 85, 247, 0.26);
        }

        .projects-table {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(20px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead {
            background-color: var(--bg-header);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: var(--text-sub);
        }

        th, td {
            padding: 0.9rem 1.2rem;
            vertical-align: top;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 22%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 17%;
            text-align: right;
            white-space: nowrap;
        }

        tbody tr {
            border-top: 1px solid var(--border);
        }

        tbody tr:hover {
            background-color: rgba(168, 85, 247, 0.12);
        }

        .project-name {
            font-weight: 600;
        }

        .project-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .link-group a {
            color: var(--accent);
            font-size: 0.9rem;
            text-decoration: none;
            margin-left: 0.25rem;
        }

        .link-group a:first-child {
            margin-left: 0;
        }

        .link-group a:hover {
            text-decoration: underline;
        }

        @media (max-width: 720px) {
            body {
                padding: 1.5rem 1rem 2rem;
            }
            h1 {
                font-size: 1.9rem;
            }
            th, td {
                padding: 0.75rem 0.7rem;
            }
            th:nth-child(1),
            td:nth-child(1) {
                width: 30%;
            }
            th:nth-child(3),
            td:nth-child(3) {
                width: 22%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="breadcrumb">
        <a href="index.html" data-en="Home" data-zh="主页">Home</a> &nbsp;›&nbsp;
        <span data-en="Projects" data-zh="项目">Projects</span>
    </div>

    <h1 data-en="Projects" data-zh="项目">Projects</h1>

    <div class="projects-table">
        <table>
            <thead>
                <tr>
                    <th data-en="NAME" data-zh="名称">NAME</th>
                    <th data-en="DESCRIPTION" data-zh="描述">DESCRIPTION</th>
                    <th data-en="LINK" data-zh="链接">LINK</th>
                </tr>
            </thead>
            <tbody>
                <!-- Projects -->

                <tr id="gomoku">
                    <td class="project-name" data-en="MATLAB Gomoku" data-zh="MATLAB 五子棋">MATLAB Gomoku</td>
                    <td class="project-desc">
                        <span data-en="Multi-level Gomoku game (3-in-a-row, 5-in-a-row, AI mode) built in MATLAB. Uses a custom game engine, win-detection logic, and simple AI heuristics."
                              data-zh="使用 MATLAB 构建的多模式五子棋游戏（三子棋、五子棋、AI 模式）。包含自定义游戏引擎、胜利检测逻辑和基础 AI 策略。">
                            Multi-level Gomoku game (3-in-a-row, 5-in-a-row, AI mode) built in MATLAB. Uses a custom game engine, win-detection logic, and simple AI heuristics.
                        </span>
                    </td>
                    <td class="link-group">
                        <!-- Read 可以以后连到你写的详细介绍页，现在先占位 -->
                        <a href="https://github.com/PowerSixxx/MATLAB-Gomoku" target="_blank" data-en="Open" data-zh="打开">Open</a>
                    </td>
                </tr>

                <!-- 示例：以后再加别的项目 -->

                    <td class="project-name">AI Flash Card Web App</td>

                    </td>

                    </td>
                </tr>
                -->

            </tbody>
        </table>
    </div>
</div>
</script>
    <!-- Language sync with main site -->
    <script>
        // Language sync with main site
        (function () {
            // Load saved language or default to English
            let currentLang = localStorage.getItem('lang') || 'en';

            function applyLanguage(lang) {
                document.querySelectorAll('[data-en]').forEach(el => {
                    const enText = el.getAttribute('data-en');
                    const zhText = el.getAttribute('data-zh');
                    const text = (lang === 'zh' ? (zhText || enText) : enText) || '';
                    if (text) {
                        el.innerHTML = text;
                    }
                });
            }

            // Apply language on initial load
            applyLanguage(currentLang);
        })();
    </script>
</body>
</html>
