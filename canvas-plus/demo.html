<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas+ demo</title>
<meta name="robots" content="noindex">
<style>
  :root { --tint: 0,0,0; --sh: rgba(20,24,31,.22); --ease: cubic-bezier(.2,.8,.2,1); color-scheme: light dark; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 2px; box-sizing: border-box; }
  /* The demo is a copy of the real Canvas+ panel (same layout, colours and wording). */
  .demo { --p-bg: #fff; --p-head: #f6f7f9; --p-bg2: #f3f4f6; --p-fg: #1f2328; --p-muted: #6b7280; --p-line: #e5e7eb; --p-acc: #bb0000; --p-soft: #fdecec; --p-softline: #f4c2c2;
    --p-blue: #2563eb; --p-amber-bg: #fdf3dc; --p-amber: #a15c07; --p-row-hot: #fde8e8;
    position: relative; background: var(--p-bg); color: var(--p-fg); border-radius: 16px; overflow: hidden; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    box-shadow: 0 40px 100px -20px var(--sh), 0 0 0 1px rgba(var(--tint),.12); transition: background .35s, color .35s; text-align: left; }
  .demo.dark { --p-bg: #1c1e23; --p-head: #16181c; --p-bg2: #262930; --p-fg: #eceef2; --p-muted: #9aa1ad; --p-line: #30343c; --p-acc: #ff5a5f; --p-soft: rgba(255,90,95,.13); --p-softline: rgba(255,90,95,.35);
    --p-blue: #6ea8ff; --p-amber-bg: rgba(245,170,40,.15); --p-amber: #f5b642; --p-row-hot: rgba(255,90,95,.12); }
  .demo button { font: inherit; color: inherit; }
  .demo svg { display: block; }
  .p-head { background: var(--p-head); border-bottom: 1px solid var(--p-line); padding: 12px 12px 8px; transition: background .35s, border-color .35s; }
  /* Same 4 columns as the tabs below: the search box runs from the left edge of tab 2 to the right edge of tab 3. */
  .p-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; align-items: center; }
  .p-row .p-search { grid-column: 2 / 4; }
  .p-end { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .p-brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
  .p-brand b { color: var(--p-acc); }
  .p-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--p-bg); border: 1px solid var(--p-line); border-radius: 10px; padding: 6px 8px; color: var(--p-muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  .p-search svg { width: 13px; height: 13px; flex: none; }
  .p-search span { overflow: hidden; text-overflow: ellipsis; }
  .p-new { flex: none; background: var(--p-acc); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 6px; }
  .p-kbd { flex: none; display: flex; gap: 2px; margin-left: auto; }
  .p-kbd i { font: 700 10px/1 inherit; font-style: normal; border: 1px solid var(--p-line); border-radius: 4px; padding: 3px 4px; background: var(--p-bg2); }
  .p-av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--p-acc); color: #fff; font-weight: 800; font-size: 12.5px; }
  .p-x { flex: none; color: var(--p-muted); font-size: 18px; line-height: 1; padding: 0 2px; }
  .p-tabs { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; margin-top: 10px; }
  .p-ind { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 9px; background: var(--p-bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .35s var(--ease), width .35s var(--ease), background .35s; }
  .p-tab { position: relative; z-index: 1; border: 0; background: transparent; font-weight: 700 !important; font-size: 12.5px !important; color: var(--p-muted) !important; padding: 8px 2px; border-radius: 9px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .p-tab.on { color: var(--p-fg) !important; }
  /* Equal columns even when the panel is narrow (embedded on another page): smaller tab labels instead of uneven tabs. */
  .demo { container: cp / inline-size; }
  .p-tab { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @container cp (max-width: 400px) { .p-tab { font-size: 11px !important; gap: 2px; } .p-tab .rd { display: none; } .p-tab svg { width: 10px; height: 10px; }
    .p-filters { gap: 6px; } .p-tog { font-size: 11px; gap: 4px; } .p-ib { gap: 4px; } .p-ib span { width: 24px; height: 24px; } .p-seg button { padding: 5px 6px; } }
  @container cp (max-width: 350px) { .p-ib span:nth-child(2) { display: none; } }
  .p-tab.ai { color: var(--p-acc) !important; }
  .p-tab svg { width: 12px; height: 12px; }
  .p-tab .rd { width: 6px; height: 6px; border-radius: 50%; background: var(--p-acc); }
  .p-body { position: relative; height: 468px; overflow: hidden; }
  .p-pane { position: absolute; inset: 0; padding: 12px; overflow: hidden; opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .3s, transform .3s var(--ease); }
  .p-pane.on { opacity: 1; transform: none; pointer-events: auto; }
  .p-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--p-bg2); border-radius: 9px; padding: 3px; gap: 2px; }
  .p-seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 8px; font-weight: 700 !important; font-size: 12px !important; color: var(--p-muted) !important; cursor: pointer; }
  .p-seg button.on { background: var(--p-bg); color: var(--p-fg) !important; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .p-filters { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .p-filters .p-seg { grid-auto-columns: auto; }
  .p-tog { display: flex; align-items: center; gap: 6px; color: var(--p-muted); font-size: 12px; white-space: nowrap; cursor: pointer; }
  .p-sw { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--p-line); border: 0; flex: none; transition: background .2s; cursor: pointer; padding: 0; }
  .p-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s var(--ease); }
  .p-sw.on { background: var(--p-acc); }
  .p-sw.on::after { transform: translateX(12px); }
  .p-ib { margin-left: auto; display: flex; gap: 6px; }
  .p-ib span { width: 28px; height: 28px; border: 1px solid var(--p-line); border-radius: 8px; display: grid; place-items: center; color: var(--p-muted); }
  .p-ib svg { width: 14px; height: 14px; }
  .p-list { display: grid; }
  .p-it { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 8px; border-bottom: 1px solid var(--p-line); border-radius: 10px; transition: background .2s, opacity .25s; }
  .p-it.hot { background: var(--p-row-hot); border-bottom-color: transparent; }
  .p-it.done { opacity: .45; }
  .p-it.done .tt { text-decoration: line-through; }
  .p-ck { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 1.6px solid var(--p-muted); display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s; }
  .p-ck svg { width: 11px; height: 11px; color: #fff; opacity: 0; }
  .p-it.done .p-ck { background: #1f9d55; border-color: #1f9d55; }
  .p-it.done .p-ck svg { opacity: 1; }
  .p-it .tt { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .p-it .mt { color: var(--p-muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .p-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transition: background .3s; }
  .p-wt { display: inline-block; margin-top: 4px; background: var(--p-soft); color: var(--p-acc); font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  /* 1.4.0: Types filter, share-of-grade chips, GPA home (same look as the extension) */
  .p-wt.mid { background: var(--p-amber-bg); color: var(--p-amber); }
  .p-wt:not(.hi):not(.mid) { background: var(--p-bg2); color: var(--p-fg); }
  .p-wt.hi { background: var(--p-soft); color: var(--p-acc); }
  .p-ib .on { color: var(--p-acc); }
  .p-ib .p-kb { position: relative; cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
  .p-ib .p-kb.open { border-color: var(--p-softline); background: var(--p-soft); }
  .p-ib .p-kb i { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--p-acc); box-shadow: 0 0 0 2px var(--p-bg); }
  .p-kcard { background: var(--p-bg2); border-radius: 14px; padding: 11px 12px; margin: 2px 0 8px; transform-origin: 50% 0; animation: p-unfold .42s cubic-bezier(.34,1.4,.64,1); }
  .p-kcard.still { animation: none; }
  @keyframes p-unfold { from { opacity: 0; transform: translateY(-6px) scale(.97); clip-path: inset(0 0 100% 0 round 14px); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0 round 14px); } }
  .p-khead { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-bottom: 6px; }
  .p-khead svg { width: 15px; height: 15px; color: var(--p-acc); }
  .p-kchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .p-kchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px; border-radius: 999px; border: 1px solid var(--p-line); background: var(--p-bg);
    color: var(--p-muted) !important; font-size: 12px !important; font-weight: 600 !important; cursor: pointer; transition: background .18s, color .18s, border-color .18s, transform .2s cubic-bezier(.34,1.56,.64,1); }
  .p-kchip:active { transform: scale(.94); }
  .p-kchip .kc { width: 15px; height: 15px; border-radius: 5px; border: 1.5px solid currentColor; display: grid; place-items: center; transition: background .18s, border-color .18s; }
  .p-kchip .kc svg { width: 11px; height: 11px; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s cubic-bezier(.34,1.56,.64,1); }
  .p-kchip.on { color: var(--p-fg) !important; border-color: var(--p-softline); background: var(--p-soft); }
  .p-kchip.on .kc { background: var(--p-acc); border-color: var(--p-acc); color: #fff; }
  .p-kchip.on .kc svg { opacity: 1; transform: none; }
  .p-kchip.pop { animation: p-pop .32s cubic-bezier(.34,1.56,.64,1); }
  .p-kchip.pop .kc svg { animation: p-tick .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes p-pop { 0% { transform: scale(.92); } 100% { transform: none; } }
  @keyframes p-tick { from { transform: scale(.4); } to { transform: none; } }
  .p-khint { margin: 7px 0 0; color: var(--p-muted); font-size: 11px; line-height: 1.5; }
  .p-list.p-fade .p-it { animation: p-rise .38s cubic-bezier(.22,1,.36,1) both; }
  .p-list.p-fade .p-it:nth-child(2) { animation-delay: .03s; } .p-list.p-fade .p-it:nth-child(3) { animation-delay: .06s; } .p-list.p-fade .p-it:nth-child(4) { animation-delay: .09s; }
  .p-list.p-fade .p-it:nth-child(5) { animation-delay: .12s; } .p-list.p-fade .p-it:nth-child(n+6) { animation-delay: .15s; }
  @keyframes p-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .p-empty { padding: 18px 12px; text-align: center; color: var(--p-muted); font-size: 12.5px; background: var(--p-bg2); border-radius: 12px; }
  .p-empty a { color: var(--p-acc); font-weight: 700; cursor: pointer; }
  .p-gpa { text-align: center; padding: 2px 0 6px; }
  .p-dialw { position: relative; width: 180px; height: 100px; margin: 0 auto; }
  .p-dial { width: 180px; height: 100px; }
  .p-dial .arc { stroke-dasharray: var(--len) 100; animation: p-arc 1.1s cubic-bezier(.22,1,.36,1); }
  @keyframes p-arc { from { stroke-dasharray: 0 100; } }
  .p-gv { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; align-items: baseline; gap: 3px; }
  .p-gv .l { position: absolute; left: 0; right: 0; bottom: 38px; color: var(--p-acc); font-weight: 800; font-size: 17px; }
  .p-gv b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .p-gv small { color: var(--p-muted); font-size: 11.5px; }
  .p-gt { font-weight: 800; font-size: 13px; margin-top: 4px; }
  .p-est { display: inline-block; font-weight: 600; font-size: 10.5px; color: var(--p-muted); background: var(--p-bg2); border: 1px solid var(--p-line); border-radius: 999px; padding: 0 7px; }
  .p-gm { color: var(--p-muted); font-size: 11.5px; margin-top: 2px; }
  .p-gp { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; margin-top: 5px; }
  .p-gp svg { width: 12px; height: 12px; color: var(--p-acc); }
  .p-gp .up { background: rgba(31,157,85,.12); color: #1f8a4c; font-weight: 800; border-radius: 999px; padding: 0 6px; }
  .p-gb { display: inline-flex; align-items: center; gap: 3px; margin-top: 8px; padding: 4px 12px; border: 1px solid var(--p-line); border-radius: 999px; color: var(--p-acc); font-weight: 700; font-size: 12px; background: var(--p-bg); }
  .p-gb svg { width: 12px; height: 12px; color: var(--p-muted); }
  .p-cgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .p-cg { text-align: left; border: 1px solid var(--p-line); border-radius: 14px; background: var(--p-bg); padding: 9px 10px 7px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, border-color .25s; }
  .p-cg:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(0,0,0,.18); border-color: var(--p-softline); }
  .p-cg:active { transform: scale(.97); }
  .p-cg .h { display: flex; align-items: center; gap: 6px; } .p-cg .h b { font-size: 13.5px; }
  .p-cg small { display: block; color: var(--p-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-cg .v { display: flex; justify-content: space-between; align-items: baseline; margin: 3px 0 0; } .p-cg .v b { font-size: 17px; letter-spacing: -.01em; }
  .p-cg .lt { font-weight: 800; font-size: 16px; } .p-cg .lt.g { color: #1f8a4c; } .p-cg .lt.b { color: #2563eb; } .p-cg .lt.o { color: var(--p-amber); }
  .p-spark { width: 100%; height: auto; display: block; margin-top: 2px; } .p-spark text { font-size: 8px; font-weight: 700; }
  .p-cg .d { display: flex; justify-content: space-between; color: var(--p-muted); font-size: 10px; padding-left: 12px; }
  .p-back a.txt { width: auto; height: auto; border-radius: 999px; padding: 3px 10px 3px 4px; white-space: nowrap; gap: 2px; font-size: 12.5px; }
  .p-back a.txt svg { width: 15px; height: 15px; }
  .p-pane.p-push { animation: p-push .42s cubic-bezier(.22,1,.36,1); }
  @keyframes p-push { from { opacity: .2; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  .demo.dark .p-gp .up { color: #4ade80; background: rgba(74,222,128,.12); } .demo.dark .p-cg .lt.g { color: #4ade80; } .demo.dark .p-cg .lt.b { color: #6ea8ff; }
  .p-rt { text-align: right; display: grid; justify-items: end; gap: 3px; }
  .p-cd { font-weight: 800; font-size: 11.5px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--p-bg2); }
  .p-cd.red { background: var(--p-row-hot); color: var(--p-acc); }
  .p-it.hot .p-cd.red { background: transparent; }
  .p-cd.amb { background: var(--p-amber-bg); color: var(--p-amber); }
  .p-dt { color: var(--p-muted); font-size: 11px; white-space: nowrap; }
  .p-acts { display: flex; gap: 4px; }
  .p-aig { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--p-softline); background: var(--p-soft); color: var(--p-acc) !important; border-radius: 999px; font-size: 11px !important; font-weight: 700 !important; padding: 1px 7px; cursor: pointer; }
  .p-aig svg { width: 11px; height: 11px; }
  .p-mail { display: grid; place-items: center; border: 1px solid var(--p-softline); background: var(--p-soft); color: var(--p-acc); border-radius: 999px; width: 26px; height: 20px; }
  .p-mail svg { width: 11px; height: 11px; }
  /* final calc */
  .p-card { border: 1px solid var(--p-line); border-radius: 12px; padding: 11px 12px; background: var(--p-bg); }
  .p-cs { display: flex; align-items: center; gap: 10px; background: var(--p-bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .p-cs b { display: block; font-size: 13.5px; }
  .p-cs small { color: var(--p-muted); font-size: 11.5px; }
  .p-cs .chg { margin-left: auto; color: var(--p-muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .p-cs .chg svg { width: 13px; height: 13px; }
  .p-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .p-tile { background: var(--p-bg2); border-radius: 12px; padding: 9px 11px; }
  .p-tile small { display: block; color: var(--p-muted); font-size: 11px; font-weight: 700; }
  .p-tile b { display: block; font-size: 20px; letter-spacing: -.01em; margin: 1px 0; }
  .p-tile span { color: var(--p-muted); font-size: 11px; }
  .p-st-h { display: flex; align-items: center; gap: 6px; color: var(--p-muted); font-size: 12px; font-weight: 700; }
  .p-st-h svg { width: 13px; height: 13px; color: var(--p-acc); }
  .p-st-big { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 0; }
  .p-st-sub { color: var(--p-muted); font-size: 11.5px; }
  .p-st-blue { color: var(--p-blue); font-weight: 700; font-size: 12px; margin-top: 4px; }
  .p-curve { margin-top: 2px; }
  .p-curve svg { width: 100%; height: auto; overflow: visible; }
  .p-curve text { font: 600 9.5px/1 -apple-system, "Segoe UI", sans-serif; }
  .p-need { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--p-bg); border-top: 1px solid var(--p-line); box-shadow: 0 -8px 20px -10px rgba(0,0,0,.15); }
  .p-need .l { min-width: 0; }
  .p-need small { display: flex; align-items: center; gap: 6px; color: var(--p-muted); font-size: 11.5px; }
  .p-need b { display: block; font-size: 12px; }
  .p-tgt { border: 1px solid var(--p-line); background: var(--p-bg2); border-radius: 999px; font-weight: 700 !important; font-size: 11px !important; padding: 1px 8px; cursor: pointer; }
  .p-need .big { margin-left: auto; font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--p-fg); font-variant-numeric: tabular-nums; }
  .p-need .big.bad { color: var(--p-acc); }
  /* AI guide */
  .p-back { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .p-back a { color: var(--p-acc); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
  .p-back a svg { width: 14px; height: 14px; }
  .p-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--p-acc); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  .p-badge svg { width: 11px; height: 11px; }
  .p-h { font-size: 15px; font-weight: 800; margin: 0; }
  .p-tldr { background: var(--p-soft); border-radius: 10px; padding: 9px 11px; font-weight: 700; font-size: 12px; margin: 8px 0; }
  .p-lbl { color: var(--p-muted); font-weight: 700; font-size: 11.5px; margin: 8px 0 4px; }
  .p-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .p-chips span { border: 1px solid var(--p-line); background: var(--p-bg2); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .p-steps { display: grid; gap: 6px; }
  .p-step { display: grid; grid-template-columns: auto 1fr; gap: 8px; background: var(--p-bg2); border-radius: 10px; padding: 8px 10px; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s var(--ease); }
  .p-step.in { opacity: 1; transform: none; }
  .p-step i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--p-acc); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; }
  .p-step b { display: block; font-size: 12px; }
  .p-step span { font-size: 11.5px; color: var(--p-fg); opacity: .85; }
  .p-step em { display: block; font-style: normal; font-size: 11px; color: var(--p-muted); margin-top: 2px; }
  .p-step em b { display: inline; color: var(--p-acc); font-size: 11px; }
